<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="100%" height="100%" style="background-color: #0b0f19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="layerGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#06b6d4" />
    </marker>
  </defs>

  <!-- Title & Branding -->
  <g transform="translate(60, 45)">
    <rect x="0" y="0" width="36" height="36" rx="8" fill="url(#headerGrad)" />
    <path d="M18 10 L28 15 L28 22 C28 27 23 30 18 32 C13 30 8 27 8 22 L8 15 Z" fill="none" stroke="#ffffff" stroke-width="2" />
    <text x="50" y="26" font-size="24" font-weight="900" fill="#ffffff" letter-spacing="0.5">FloodShield</text>
    <text x="195" y="26" font-size="20" font-weight="400" fill="#64748b">|</text>
    <text x="215" y="26" font-size="20" font-weight="700" fill="#e2e8f0">System Architecture &amp; Data Flow Diagram</text>
    <text x="1000" y="25" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="end">DELHI NCR 500m GRID · EPSG:4326</text>
  </g>

  <!-- Layer 1: Geospatial & Atmospheric Data -->
  <g transform="translate(60, 100)">
    <rect width="1080" height="95" rx="14" fill="url(#layerGrad1)" stroke="#1e293b" stroke-width="1.5" />
    <rect width="1080" height="95" rx="14" fill="none" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.3" />
    <text x="20" y="30" font-size="11" font-weight="800" fill="#38bdf8" letter-spacing="1">1. GEOSPATIAL &amp; ATMOSPHERIC INPUTS</text>
    
    <g transform="translate(20, 42)">
      <rect width="245" height="40" rx="8" fill="url(#boxGrad)" stroke="#334155" stroke-width="1" />
      <text x="15" y="25" font-size="12" font-weight="700" fill="#f8fafc">Delhi NCR 500m Grid</text>
      <text x="160" y="25" font-size="10" font-family="monospace" fill="#94a3b8">9,494 Cells</text>
    </g>

    <g transform="translate(285, 42)">
      <rect width="250" height="40" rx="8" fill="url(#boxGrad)" stroke="#334155" stroke-width="1" />
      <text x="15" y="25" font-size="12" font-weight="700" fill="#f8fafc">Topography &amp; DEM</text>
      <text x="145" y="25" font-size="10" font-family="monospace" fill="#94a3b8">HAND / TWI / Slope</text>
    </g>

    <g transform="translate(555, 42)">
      <rect width="250" height="40" rx="8" fill="url(#boxGrad)" stroke="#334155" stroke-width="1" />
      <text x="15" y="25" font-size="12" font-weight="700" fill="#f8fafc">OpenStreetMap Infrastructure</text>
      <text x="195" y="25" font-size="10" font-family="monospace" fill="#94a3b8">Drains / Roads</text>
    </g>

    <g transform="translate(825, 42)">
      <rect width="235" height="40" rx="8" fill="url(#boxGrad)" stroke="#334155" stroke-width="1" />
      <text x="15" y="25" font-size="12" font-weight="700" fill="#f8fafc">Atmospheric Scenarios</text>
      <text x="160" y="25" font-size="10" font-family="monospace" fill="#94a3b8">5 Storm Profiles</text>
    </g>
  </g>

  <!-- Flow Arrow 1 -> 2 -->
  <line x1="600" y1="195" x2="600" y2="225" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Layer 2: Simulation & Hydrology Core -->
  <g transform="translate(60, 230)">
    <rect width="1080" height="95" rx="14" fill="url(#layerGrad1)" stroke="#1e293b" stroke-width="1.5" />
    <rect width="1080" height="95" rx="14" fill="none" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.3" />
    <text x="20" y="30" font-size="11" font-weight="800" fill="#38bdf8" letter-spacing="1">2. SIMULATION &amp; HYDROLOGY CORE (Deterministic Engine)</text>
    
    <g transform="translate(20, 42)">
      <rect width="245" height="40" rx="8" fill="url(#boxGrad)" stroke="#334155" stroke-width="1" />
      <text x="15" y="25" font-size="12" font-weight="700" fill="#f8fafc">Simulation Virtual Clock</text>
      <text x="175" y="25" font-size="10" font-family="monospace" fill="#38bdf8">1×–60× Speed</text>
    </g>

    <g transform="translate(285, 42)">
      <rect width="250" height="40" rx="8" fill="url(#boxGrad)" stroke="#334155" stroke-width="1" />
      <text x="15" y="25" font-size="12" font-weight="700" fill="#f8fafc">Vectorized Weather Field</text>
      <text x="175" y="25" font-size="10" font-family="monospace" fill="#38bdf8">Trapezoid Integrator</text>
    </g>

    <g transform="translate(555, 42)">
      <rect width="250" height="40" rx="8" fill="url(#boxGrad)" stroke="#334155" stroke-width="1" />
      <text x="15" y="25" font-size="12" font-weight="700" fill="#f8fafc">Runoff &amp; Infiltration</text>
      <text x="160" y="25" font-size="10" font-family="monospace" fill="#38bdf8">Green-Ampt Hydraulics</text>
    </g>

    <g transform="translate(825, 42)">
      <rect width="235" height="40" rx="8" fill="url(#boxGrad)" stroke="#334155" stroke-width="1" />
      <text x="15" y="25" font-size="12" font-weight="700" fill="#f8fafc">Yamuna River Stage</text>
      <text x="155" y="25" font-size="10" font-family="monospace" fill="#38bdf8">Warning 204.5m</text>
    </g>
  </g>

  <!-- Flow Arrow 2 -> 3 -->
  <line x1="600" y1="325" x2="600" y2="355" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Layer 3: Machine Learning & Explainable AI -->
  <g transform="translate(60, 360)">
    <rect width="1080" height="95" rx="14" fill="url(#layerGrad1)" stroke="#1e293b" stroke-width="1.5" />
    <rect width="1080" height="95" rx="14" fill="none" stroke="#a855f7" stroke-width="1" stroke-opacity="0.4" />
    <text x="20" y="30" font-size="11" font-weight="800" fill="#c084fc" letter-spacing="1">3. MACHINE LEARNING &amp; EXPLAINABLE AI (XAI)</text>
    
    <g transform="translate(20, 42)">
      <rect width="330" height="40" rx="8" fill="url(#boxGrad)" stroke="#475569" stroke-width="1" />
      <text x="15" y="25" font-size="12" font-weight="700" fill="#f8fafc">XGBoost Multi-Horizon Classifier</text>
      <text x="245" y="25" font-size="10" font-family="monospace" fill="#c084fc">+1h · +3h · +6h</text>
    </g>

    <g transform="translate(370, 42)">
      <rect width="340" height="40" rx="8" fill="url(#boxGrad)" stroke="#475569" stroke-width="1" />
      <text x="15" y="25" font-size="12" font-weight="700" fill="#f8fafc">SHAP TreeExplainer (XAI)</text>
      <text x="195" y="25" font-size="10" font-family="monospace" fill="#c084fc">Local Feature Attribution</text>
    </g>

    <g transform="translate(730, 42)">
      <rect width="330" height="40" rx="8" fill="url(#boxGrad)" stroke="#475569" stroke-width="1" />
      <text x="15" y="25" font-size="12" font-weight="700" fill="#f8fafc">Risk Engine &amp; CAP Alerts</text>
      <text x="210" y="25" font-size="10" font-family="monospace" fill="#c084fc">Hysteresis Cooldown</text>
    </g>
  </g>

  <!-- Flow Arrow 3 -> 4 -->
  <line x1="600" y1="455" x2="600" y2="485" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Layer 4: FastAPI Backend & State Caching -->
  <g transform="translate(60, 490)">
    <rect width="1080" height="95" rx="14" fill="url(#layerGrad1)" stroke="#1e293b" stroke-width="1.5" />
    <rect width="1080" height="95" rx="14" fill="none" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.3" />
    <text x="20" y="30" font-size="11" font-weight="800" fill="#38bdf8" letter-spacing="1">4. FASTAPI BACKEND SERVICES &amp; CACHE LAYER (Port 8000)</text>
    
    <g transform="translate(20, 42)">
      <rect width="330" height="40" rx="8" fill="url(#boxGrad)" stroke="#334155" stroke-width="1" />
      <text x="15" y="25" font-size="12" font-weight="700" fill="#f8fafc">High-Throughput REST API</text>
      <text x="200" y="25" font-size="10" font-family="monospace" fill="#38bdf8">/api/flood-map, /zones</text>
    </g>

    <g transform="translate(370, 42)">
      <rect width="340" height="40" rx="8" fill="url(#boxGrad)" stroke="#334155" stroke-width="1" />
      <text x="15" y="25" font-size="12" font-weight="700" fill="#f8fafc">In-Memory LRU State Cache</text>
      <text x="215" y="25" font-size="10" font-family="monospace" fill="#10b981">28ms Ultra-Fast</text>
    </g>

    <g transform="translate(730, 42)">
      <rect width="330" height="40" rx="8" fill="url(#boxGrad)" stroke="#334155" stroke-width="1" />
      <text x="15" y="25" font-size="12" font-weight="700" fill="#f8fafc">WebSocket Broadcaster</text>
      <text x="205" y="25" font-size="10" font-family="monospace" fill="#38bdf8">/ws/live (2s Ticks)</text>
    </g>
  </g>

  <!-- Flow Arrow 4 -> 5 -->
  <line x1="600" y1="585" x2="600" y2="615" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Layer 5: Interactive Operations Frontend -->
  <g transform="translate(60, 620)">
    <rect width="1080" height="110" rx="14" fill="url(#layerGrad1)" stroke="#1e293b" stroke-width="1.5" />
    <rect width="1080" height="110" rx="14" fill="none" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.3" />
    <text x="20" y="28" font-size="11" font-weight="800" fill="#38bdf8" letter-spacing="1">5. INTERACTIVE OPERATIONS FRONTEND (Port 5173 · React 19 + Vite)</text>
    
    <g transform="translate(20, 40)">
      <rect width="250" height="55" rx="8" fill="url(#boxGrad)" stroke="#334155" stroke-width="1" />
      <text x="15" y="25" font-size="12" font-weight="700" fill="#f8fafc">React-Leaflet Canvas Map</text>
      <text x="15" y="44" font-size="10" font-family="monospace" fill="#10b981">OpenStreetMap 60 FPS</text>
    </g>

    <g transform="translate(285, 40)">
      <rect width="255" height="55" rx="8" fill="url(#boxGrad)" stroke="#334155" stroke-width="1" />
      <text x="15" y="25" font-size="12" font-weight="700" fill="#f8fafc">Zustand State Store</text>
      <text x="15" y="44" font-size="10" font-family="monospace" fill="#38bdf8">Debounced Throttled Sync</text>
    </g>

    <g transform="translate(555, 40)">
      <rect width="255" height="55" rx="8" fill="url(#boxGrad)" stroke="#334155" stroke-width="1" />
      <text x="15" y="25" font-size="12" font-weight="700" fill="#f8fafc">Floating Inspection HUD</text>
      <text x="15" y="44" font-size="10" font-family="monospace" fill="#38bdf8">0ms Hover Diagnostics</text>
    </g>

    <g transform="translate(825, 40)">
      <rect width="235" height="55" rx="8" fill="url(#boxGrad)" stroke="#334155" stroke-width="1" />
      <text x="15" y="25" font-size="12" font-weight="700" fill="#f8fafc">SHAP Waterfall Drawer</text>
      <text x="15" y="44" font-size="10" font-family="monospace" fill="#c084fc">Recharts Analytics</text>
    </g>
  </g>
</svg>
