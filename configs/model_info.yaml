model_name: STG-Mamba
version: Ensemble of three seeds (ens_perlead_hf5)
description: A Mamba state-space block reads each gauge's weather history, and a graph layer passes information along the river network, to forecast daily flow four days ahead. It is weather-driven and never takes observed river flow as input.
forecaster: STG-Mamba, three per-lead models with flood-day weighting, averaged
correction_stage: XGBoost residual correction was tested on 2012 and left off, because it caught about 100 fewer flood days at each lead
training_years: 1991 - 2008
validation_years: 2009 - 2012
time_step: Daily
forecast_horizons: Lead days 1 to 4
data_sources:
- name: CAMELS-IND v2.2
  role: Observed daily streamflow, catchment-mean weather forcings, gauge locations and catchment attributes
  citation: Zenodo, doi:10.5281/zenodo.14999580
- name: HydroRIVERS
  role: The river network used to link gauges upstream to downstream
  citation: HydroSHEDS / WWF
- name: NASA Blue Marble
  role: Earth imagery on this site
  citation: NASA Visible Earth
disclaimer: Research prototype, not a warning service. An alert means forecast daily flow near a gauge's own 95th-percentile flow, not an official CWC flood level. Replays use recorded rain for the four forecast days, so live skill will be lower.
