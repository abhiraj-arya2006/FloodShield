alert_margin: 0.1
selection: Set manually by the user on 2026-11-04. This overrides the selection rule; 0.10 does not meet its hit-rate
  target of 0.90.
definition: alert if forecast_m3s >= q95 * (1 - alert_margin); dimensionless fraction of the gauge's training-year
  q95 (configs/flow_thresholds.csv). One value for all gauges and leads.
flood_day: observed_m3s > q95
chosen_on: '2026-11-04'
forecasts:
  run: ens_perlead_hf5
  members:
  - stg_mamba_perlead_hf5
  - stg_mamba_perlead_hf5_s1
  - stg_mamba_perlead_hf5_s2
  xgboost_correction: false
