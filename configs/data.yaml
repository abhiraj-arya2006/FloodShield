# Data configuration.
# CAMELS-IND and HydroRIVERS are downloaded and verified (scripts/download_data.py).
# Gauge selection: scripts/select_gauges.py -> configs/selected_gauges.csv.
# Model inputs: CAMELS-IND forcings (scripts/build_forcing_table.py). Open-Meteo: NOT USED.

paths:
  data_dir: ./data
  raw:
    camels_ind: ./data/raw/camels_ind
    hydrorivers: ./data/raw/hydrorivers
    open_meteo: ./data/raw/open_meteo
  processed: ./data/processed
  graph: ./data/graph
  selected_gauges: ./configs/selected_gauges.csv          # tracked in Git
  gauge_selection_report: ./outputs/gauge_selection_report.csv   # git-ignored

sources:
  camels_ind:
    version: "2.2"
    zenodo_record: 14999580            # https://zenodo.org/records/14999580
    paper_doi: 10.5194/essd-17-461-2025
    license: CC-BY-4.0                  # cite the ESSD paper (see Disclaimer.txt)
    download: scripted                  # md5-verified by scripts/download_data.py
    files:
      subset_archive: CAMELS_IND_Catchments_Streamflow_Sufficient.zip
      subset_archive_md5: 3993c25ba7d7b86df0541de91e094f39
      data_description: 00_CAMELS_IND_Data_Description.pdf
      data_description_md5: 19cf924c9a0a5417163ba773432ac274
      # Paths below are relative to paths.raw.camels_ind (verified after extraction).
      gauge_names: attributes_csv/camels_ind_name.csv       # gauge_id, ghi_stn_id, cwc_site_name, river_basin, cwc_river, ghi_group, flow_availability
      gauge_coords: attributes_csv/camels_ind_topo.csv      # gauge_id, cwc_lat, cwc_lon, ghi_lat, ghi_lon, ... cwc_area, ghi_area
      dam_attributes: attributes_csv/camels_ind_anth.csv    # num_dams, n_dams, res_store_sum, total_storage, reservoir_index, first/last_dam_year
      static_attributes_dir: attributes_csv                 # anth, clim, geol, hydro, land, name, soil, topo
      streamflow_observed: streamflow_timeseries/streamflow_observed.csv
      gauge_points: shapefiles_catchment/gauge_stations.shp # EPSG:4326, 242 points
      catchment_polygons: shapefiles_catchment/catchments.shp  # EPSG:4326, 242 polygons
      # Present but NOT used: catchment_mean_forcings/ (IMD/IMDAA forcings; we use
      # Open-Meteo instead) and streamflow_timeseries/lstm_pred_streamflow.csv
      # (the authors' LSTM predictions, not observations).
    subset_gauge_count: 242   # actual count in the v2.2 zip (the PDF text says 228)
    coverage: {start: "1980-01-01", end: "2020-12-31"}   # verified: 14,976 contiguous daily rows
  hydrorivers:
    version: "1.0"
    url: https://www.hydrosheds.org/products/hydrorivers
    archive: HydroRIVERS_v10_as_shp.zip   # Asia shapefile
    archive_url: https://data.hydrosheds.org/file/HydroRIVERS/HydroRIVERS_v10_as_shp.zip
    archive_bytes: 90510995               # no checksum published; verified by size + zip test
    shapefile: HydroRIVERS_v10_as_shp/HydroRIVERS_v10_as.shp   # relative to paths.raw.hydrorivers; EPSG:4326, 1,428,959 lines
    license: HydroSHEDS license (free for scientific, educational and commercial use; attribution required)
    download: scripted
  open_meteo_archive:
    docs: https://open-meteo.com/en/docs/historical-weather-api
    download: scripted   # scripts/fetch_open_meteo_archive.py (Phase B, not implemented yet)

basins:
  - godavari
  - mahanadi

# gauge_id is 5 digits: first 2 = CWC basin code, last 3 = station number
# (Data Description PDF, Table 3). The CSVs store gauge_id as an integer, so the
# leading zero is lost (3002, not 03002). Always read gauge_id as a string and
# zero-pad to 5 digits before taking the prefix or matching file names.
gauge_id:
  digits: 5
  zero_pad: true

# Verified: each prefix maps to exactly one river_basin value in camels_ind_name.csv,
# and agrees with the streamflow column headers and forcing file names.
basin_code_prefixes:
  godavari: "03"   # river_basin == "Godavari"; 50 gauges in the subset
  mahanadi: "08"   # river_basin == "Mahanadi"; 19 gauges in the subset

frequency: daily
target: streamflow
target_units: m3/s   # per Data Description PDF, section 3
missing_value: empty # blank cells in streamflow_observed.csv; no sentinel values found

# Gauge selection for STG-Mamba training (scripts/select_gauges.py).
# ALL VALUES ARE PROPOSED, to be tuned. Split periods are read from
# configs/training.yaml, not from here.
gauge_selection:
  status: PROPOSED
  active_preset: proposed
  monsoon_months: [6, 7, 8, 9]   # June to September
  # Coverage = percent of days with an observed value. Gauges below any
  # minimum are dropped.
  presets:
    lenient:
      coverage_min:         {train: 50, validation: 40, test: 40}
      monsoon_coverage_min: {train: 50, validation: 40, test: 40}
    proposed:
      coverage_min:         {train: 70, validation: 60, test: 60}
      monsoon_coverage_min: {train: 70, validation: 60, test: 60}
    strict:
      coverage_min:         {train: 85, validation: 75, test: 75}
      monsoon_coverage_min: {train: 85, validation: 75, test: 75}
  # Manual decisions that override the threshold result. Each entry needs a
  # reason; the report and selected_gauges.csv record "manual_include".
  manual_include:
    - gauge_id: "08029"   # Rajim (Mahanadi)
      reason: "Kept by project decision; validation coverage 58.9% is just below the 60% minimum."
  # Flags mark gauges for review; they never drop a gauge automatically.
  flags:
    heavy_dam_reservoir_index_min: 1.0   # reservoir_index = total storage / mean annual flow
    small_area_km2_max: 500              # ghi_area below this
    zero_flow_pct_max: 50                # percent of observed days with zero flow above this
    constant_run_days_min: 30            # identical consecutive non-zero values for this many days
    coord_mismatch_km_max: 5             # cwc vs ghi station distance above this
    high_flow_quantile: 0.95             # test days above the train-period quantile; flag if none

# River graph between the selected gauges (scripts/build_graph.py).
# ALL VALUES ARE PROPOSED, to be tuned after reviewing the snapping report.
river_graph:
  bbox_margin_deg: 0.5            # HydroRIVERS loaded only inside the catchments' bbox + margin
  metric_crs: "EPSG:7755"         # WGS 84 / India NSF LCC (metres) for distances and areas
  snap_max_distance_km: 5.0       # candidate reaches within this distance of (ghi_lat, ghi_lon)
  area_ratio_tolerance: 0.5       # accept UPLAND_SKM / ghi_area within [1/1.5, 1.5]
  high_conf_ratio_tolerance: 0.1  # "high" confidence: ratio within [1/1.1, 1.1] ...
  high_conf_distance_km: 1.0      # ... and within this distance
  nested_fraction_min: 0.9        # polygon A counts as inside B if >= 90% of A's area is in B
  outputs:
    dir: ./data/graph
    tracked_edges: ./configs/graph_edges.csv
    map: ./outputs/graph_map.png

# NOT USED (project decision, 2026-10-27): model inputs are the CAMELS-IND
# forcings; live sources are in docs/live_data_options.md. This Open-Meteo
# Phase A plan is kept for reference only; no bulk data was fetched.
# Checked against https://open-meteo.com/en/docs/historical-weather-api and
# https://open-meteo.com/en/docs.
open_meteo:
  status: NOT_USED
  archive_base_url: https://archive-api.open-meteo.com/v1/archive
  forecast_base_url: https://api.open-meteo.com/v1/forecast
  # Without `models`, the Archive API mixes ERA5 with ECMWF IFS 9 km from 2017
  # onwards; the docs advise ERA5 or ERA5-Land for multi-decade consistency.
  # ERA5 (0.25 deg) has precipitation natively; ERA5-Land (0.1 deg) does not
  # (docs variable table). ET0 under ERA5 is marked "only with ERA5-Seamless".
  model: era5
  grid_resolution_deg: 0.25
  grid_origin_deg: 0.0          # cell centres at multiples of 0.25 deg (checked by test request)
  cell_selection: nearest       # API default "land" may pick a different cell by elevation
  elevation: nan                # disables statistical downscaling (grid-cell mean elevation)
  timezone: Asia/Kolkata
  # Daily variables present with the same name and unit in BOTH APIs.
  daily_variables:
    - precipitation_sum           # mm
    - temperature_2m_max          # degC
    - temperature_2m_min          # degC
    - temperature_2m_mean         # degC
    - et0_fao_evapotranspiration  # mm
  # Excluded: soil moisture. Archive layers 0-7/7-28/28-100/100-255 cm (hourly,
  # plus daily *_mean); Forecast layers 0-1/1-3/3-9/9-27/27-81 cm (hourly only).
  date_range: {start: "1990-01-01", end: "2018-12-31"}
  sampling:
    single_point_area_km2_max: 5000   # ghi_area below this: 1 point (representative point)
    medium_area_km2_max: 50000        # 5,000 to 50,000 km2: up to medium_max_points
    medium_max_points: 4
    large_max_points: 12              # over 50,000 km2
  cell_plan: ./data/raw/open_meteo/cell_plan.csv
  gauge_cell_plan: ./data/raw/open_meteo/gauge_cells.csv
  rate_limits:   # https://open-meteo.com/en/terms (free, non-commercial)
    per_minute: 600
    per_hour: 5000
    per_day: 10000
